<!DOCTYPE html>
<html lang="fr">
<head>
    <title>SPRINTIA - Historique récupération</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" type="image/png" href="../../assets/icons-SPRINTIA/icon-navigateur.png">
    <link rel="manifest" href="../../manifest.json">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SPRINTIA">
    <link rel="apple-touch-icon" href="../../assets/icons-SPRINTIA/icon-192.png">

</head>

<body>
    <div class="container-logo-dynamique">
        <div class="logo-dynamique"></div>
    </div>
    
    <section class="header">

        <div class="logo">SPRINTIA</div>
            
        <ul class="header-container-items">

            <li class="header-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
                Entraînement
            </li>
            <li class="header-items selected" data-onglet="Progression">
                <i class="icon_progression"></i>
                Progression
            </li>
            <li class="header-items" data-onglet="Outils">
                <i class="icon_outils"></i>
                Outils
            </li>
            <li class="header-items" data-onglet="Plus">
                <i class="icon_plus"></i>
                Plus
            </li>

        </ul>

    </section>
    <section class="tab-bars">

        <ul class="tab-bars-container-items">

            <li class="tab-bars-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
                <p class="tab-bars-items-name">Entraînement</p>
            </li>
            <li class="tab-bars-items selected" data-onglet="Progression">
                <i class="icon_progression"></i>
                <p class="tab-bars-items-name">Progression</p>
            </li>
            <li class="tab-bars-items" data-onglet="Outils">
                <i class="icon_outils"></i>
                <p class="tab-bars-items-name">Outils</p>
            </li>
            <li class="tab-bars-items" data-onglet="Plus">
                <i class="icon_plus"></i>
                <p class="tab-bars-items-name">Plus</p>
            </li>

        </ul>

    </section>
    
    <div class="toolbar">
        <h1>Historique de récupération</h1>
        <div class="container-command">
            <a href="ajouter-recuperation.html">
                <i class="icon_add"></i>
            </a>
        </div>
    </div>

    <div class="visuel-information" id="aucune-data">
        <i class="icon_folder_open"></i>
        <h3>Aucune donnée de récupération</h3>
        <p>
            Vous avez enregistré aucune donnée de récupération.
        </p>
    </div>

    <div class="carousel table">
        <div class="carousel-content table">
            <table id="tableau-historique">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>FC repos</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody><!-- Remplis en js --></tbody>
            </table>
        </div>
    </div>


    <script src="../../assets/base-js/base.js"></script>

    <!-- Import bibliothèque pour simplifier le code de indexed db -->
    <script src="../../assets/bibliotheques/dexie.js"></script>
    <script src="../../assets/base-js/db-config.js"></script> <!-- Connexion bdd -->
    <script src="script-historique.js"></script>
    
</body>
</html>
