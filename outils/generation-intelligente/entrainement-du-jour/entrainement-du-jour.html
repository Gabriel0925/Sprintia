<!DOCTYPE html>
<html lang="fr">
<head>
    <title>SPRINTIA - Entraînement du Jour</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">

    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="icon" type="image/png" href="../../../assets/icons-SPRINTIA/icon-navigateur.png">
    <link rel="manifest" href="../../../manifest.json">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SPRINTIA">
    <link rel="apple-touch-icon" href="../../../assets/icons-SPRINTIA/icon-192.png">

</head>

<body>
    <div class="container-logo-dynamique">
        <div class="logo-dynamique"></div>
    </div>
    
    <section class="header">

        <div class="logo">SPRINTIA</div>
            
        <ul class="header-container-items">

            <li class="header-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
                Entraînement
            </li>
            <li class="header-items" data-onglet="Progression">
                <i class="icon_progression"></i>
                Progression
            </li>
            <li class="header-items selected" data-onglet="Outils">
                <i class="icon_outils"></i>
                Outils
            </li>
            <li class="header-items" data-onglet="Plus">
                <i class="icon_plus"></i>
                Plus
            </li>

        </ul>

    </section>
    <section class="tab-bars">

        <ul class="tab-bars-container-items">

            <li class="tab-bars-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
                <p class="tab-bars-items-name">Entraînement</p>
            </li>
            <li class="tab-bars-items" data-onglet="Progression">
                <i class="icon_progression"></i>
                <p class="tab-bars-items-name">Progression</p>
            </li>
            <li class="tab-bars-items selected" data-onglet="Outils">
                <i class="icon_outils"></i>
                <p class="tab-bars-items-name">Outils</p>
            </li>
            <li class="tab-bars-items" data-onglet="Plus">
                <i class="icon_plus"></i>
                <p class="tab-bars-items-name">Plus</p>
            </li>

        </ul>

    </section>
    
    <div class="toolbar">
        <h1>Entraînement du Jour</h1> 
        <div class="container-command display-none">
            <i class="icon_refresh"></i>
        </div>
    </div>

    <section class="container-item-workout-day">

        <section class="item-workout-day">

            <h2>Quelle durée ?</h2>
            <section class="container-round-input">
                
                <div class="round-input-item duree selected" id="25">
                    <p>25</p>
                </div>
                <div class="round-input-item duree" id="50">
                    <p>50</p>
                </div>
            
            </section>

        </section>

        <section class="item-workout-day">

            <h2>Quel sport ?</h2>
            <section class="container-round-input">
                
                <div class="round-input-item sport selected" id="course" onclick="">
                    <i class="icon_entrainement"></i>
                </div>
                <div class="round-input-item sport" id="velo">
                    <i class="icon_velo"></i>
                </div>
                <div class="round-input-item sport" id="natation">
                    <i class="icon_natation"></i>
                </div>
            
            </section>

        </section>
        
        <section class="item-workout-day">

            <h2>Quelle intensité ?</h2>
            <section class="container-round-input">
                
                <div class="round-input-item intensity selected" id="facile">Facile</div>
                <div class="round-input-item intensity" id="modere">Modéré</div>
                <div class="round-input-item intensity" id="difficile">Difficile</div>
            
            </section>

        </section>

    </section>

    <div class="container-center-marge">
        <button id="button-generation-entrainements" class="size-block">Générer un entraînement</button>
    </div>

    <script src="../../../assets/base-js/base.js"></script>
    <script src="bdd-entrainement.js"></script>
    <script src="script-entrainement-du-jour.js"></script>
    
</body>
</html>
